name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskmaster
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskmaster"
          --health-interval 3s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ruff check
        run: ruff check

      - name: Mypy check
        run: mypy src/

      - name: Run SQLite tests (external HTTP disabled)
        run: pytest -v

      - name: Run PostgreSQL tests (isolated schemas, external HTTP disabled)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/taskmaster
        run: pytest -v

      - name: Check PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/taskmaster
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run frontend tests
        run: node --test frontend/tests/*.test.mjs
