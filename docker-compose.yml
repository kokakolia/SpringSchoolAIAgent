services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskmaster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres -d taskmaster
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/taskmaster
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env (at least 16 characters)}
      # Host port is loopback-only; Docker's gateway is not a loopback peer.
      APP_ALLOW_HTTP: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
